<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - ECON7110 Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #fff; color: #222; min-height: 100vh; }
        .topbar { background: #51247A; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .topbar .brand { font-size: 20px; font-weight: 500; }
        .topbar .meta { font-size: 15px; opacity: 0.85; }
        .screen { max-width: 1100px; margin: 0 auto; padding: 34px 30px; }
        .join { text-align: center; padding: 30px 20px; }
        .join h2 { font-size: 34px; color: #51247A; margin-bottom: 8px; }
        .join p { font-size: 21px; color: #555; margin-bottom: 24px; }
        #qrcode { display: inline-block; padding: 16px; background: #fff; border: 1px solid #eee; border-radius: 12px; }
        .join .url { margin-top: 20px; font-family: monospace; font-size: 18px; color: #51247A; word-break: break-all; }
        .qtext { font-size: 30px; font-weight: 600; color: #2b2b2b; line-height: 1.35; margin-bottom: 22px; }
        .status { font-size: 19px; color: #51247A; font-weight: 500; margin-bottom: 22px; }
        .discuss-bar { background: #51247A; color: #fff; border-radius: 10px; padding: 26px 30px; margin-bottom: 26px; display: flex; align-items: center; gap: 22px; }
        .discuss-bar svg { flex-shrink: 0; }
        .discuss-bar .dh { font-size: 38px; font-weight: 600; line-height: 1.1; }
        .discuss-bar .ds { font-size: 22px; opacity: 0.93; margin-top: 6px; }
        .opt-list { }
        .opt { display: flex; gap: 12px; font-size: 22px; color: #333; padding: 13px 18px; border: 1px solid #e6e6e6; border-radius: 8px; margin-bottom: 11px; }
        .opt .l { font-weight: 600; color: #51247A; }
        .gain { background: #eef7f0; border: 1px solid #b9ddc4; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; font-size: 20px; color: #1f6e3d; }
        .bar-row { margin-bottom: 18px; }
        .bar-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 19px; color: #444; margin-bottom: 6px; gap: 14px; }
        .bar-label { font-weight: 500; }
        .bar-pct { color: #888; font-size: 16px; white-space: nowrap; }
        .bar-pct.c { color: #1f6e3d; font-weight: 600; }
        .bar-track { height: 16px; background: #efefef; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; background: #7b4397; border-radius: 5px; }
        .bar-fill.correct { background: #2e7d32; }
        .reveal-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 30px; align-items: start; }
        .flow-title { font-size: 15px; color: #888; text-align: center; margin-top: 6px; }
        .total { text-align: center; color: #888; font-size: 16px; margin-top: 16px; }
        @media (max-width: 720px) { .reveal-grid { grid-template-columns: 1fr; } .qtext { font-size: 24px; } .opt { font-size: 19px; } }

        /* ---- Number game ---- */
        .num-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .num-tile { border: 1px solid #e6e6e6; border-radius: 10px; padding: 22px 28px; }
        .num-tile .k { font-size: 22px; color: #555; }
        .num-tile .v { font-size: 104px; font-weight: 600; line-height: 1.1; color: #2b2b2b; }
        .num-tile.t { background: #eef7f0; border-color: #b9ddc4; }
        .num-tile.t .k, .num-tile.t .v { color: #1f6e3d; }
        .num-prevs { margin-bottom: 20px; }
        .num-prev { font-size: 20px; color: #555; margin-bottom: 6px; }
        .num-prev strong { color: #2b2b2b; }
        .num-prev strong.t { color: #1f6e3d; }
        .num-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 30px; align-items: start; }
        .num-legend { display: flex; gap: 24px; align-items: center; padding-left: 150px; font-size: 15px; color: #444; margin-bottom: 12px; }
        .num-legend span { display: inline-flex; align-items: center; gap: 8px; }
        .num-legend i { display: inline-block; height: 18px; }
        .num-legend i.avg { border-left: 2px dashed #444; }
        .num-legend i.tgt { border-left: 3px solid #2e7d32; }
        .num-row { display: flex; align-items: stretch; margin-bottom: 12px; }
        .num-rl { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding-bottom: 6px; }
        .num-rl .r { font-size: 18px; font-weight: 600; color: #2b2b2b; }
        .num-rl .a { font-size: 14px; color: #555; }
        .num-rl .t { font-size: 14px; font-weight: 600; color: #1f6e3d; }
        .num-plot { flex: 1; min-width: 0; position: relative; border-bottom: 2px solid #bdbdbd; }
        .num-bars { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); column-gap: 1px; align-items: end; }
        .num-bars div { background: #7b4397; border-radius: 1px 1px 0 0; }
        .num-m { position: absolute; top: 0; bottom: 0; }
        .num-m.avg { border-left: 2px dashed #444; margin-left: -1px; }
        .num-m.tgt { border-left: 3px solid #2e7d32; margin-left: -1.5px; }
        .num-axis { display: flex; }
        .num-axis .sp { width: 150px; flex-shrink: 0; font-size: 14px; color: #555; }
        .num-axis .tk { flex: 1; position: relative; height: 22px; }
        .num-axis .tk span { position: absolute; top: 0; transform: translateX(-50%); font-size: 14px; color: #555; }
        .num-win { border: 2px solid #51247A; border-radius: 10px; padding: 20px 22px; }
        .num-win .k { font-size: 16px; font-weight: 600; color: #51247A; }
        .num-win .g { font-size: 76px; font-weight: 700; line-height: 1; color: #51247A; margin: 10px 0 12px; }
        .num-win p { font-size: 17px; color: #444; line-height: 1.4; margin-bottom: 12px; }
        .num-win p:last-child { margin-bottom: 0; }
        .num-win .code { background: #f7f4fb; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
        .num-win .ck { font-size: 14px; color: #555; }
        .num-win .cv { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 42px; font-weight: 700; letter-spacing: 5px; line-height: 1.15; color: #51247A; }
        @media (max-width: 720px) {
            .num-grid { grid-template-columns: 1fr; }
            .num-tile .v { font-size: 60px; }
            .num-rl, .num-axis .sp { width: 96px; }
            .num-legend { padding-left: 0; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="topbar"><span class="brand">ECON7110 Live</span><span class="meta" id="meta"></span></div>
    <div class="screen"><div id="content"><div class="join"><p>Loading…</p></div></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBZCW5tAWc-I5XAXqFDRazoeWIhQtNxcu4",
            authDomain: "econ7110.firebaseapp.com",
            databaseURL: "https://econ7110-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "econ7110",
            storageBucket: "econ7110.firebasestorage.app",
            messagingSenderId: "667390196212",
            appId: "1:667390196212:web:59b6cc3983be3a1aa1a1a1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentTerm = null, resultsVisible = false;
        let questionsCache = {}, responsesCache = {};
        let respSubId = null, unsubResp = null, unsubQ = null;
        let lastMode = null;

        onValue(ref(db, 'settings/currentTerm'), (snap) => {
            currentTerm = snap.val();
            if (unsubQ) { unsubQ(); unsubQ = null; }
            questionsCache = {};
            if (currentTerm) unsubQ = onValue(ref(db, `terms/${currentTerm}/questions`), (s) => { questionsCache = s.val() || {}; render(); });
            else render();
        });
        onValue(ref(db, 'settings/resultsVisible'), (snap) => { resultsVisible = snap.val() === true; render(); });

        function activeQ() {
            const ids = Object.keys(questionsCache).filter(id => questionsCache[id].active);
            if (!ids.length) return null;
            return { id: ids[0], q: questionsCache[ids[0]] };
        }
        function manageRespSub(id) {
            if (id === respSubId) return;
            if (unsubResp) { unsubResp(); unsubResp = null; }
            respSubId = id; responsesCache = {};
            if (id && currentTerm) unsubResp = onValue(ref(db, `terms/${currentTerm}/responses/${id}`), (s) => { responsesCache = s.val() || {}; render(); });
        }

        const sum = a => a.reduce((x, y) => x + y, 0);
        const L = i => String.fromCharCode(65 + i);
        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
        function countsForRound(roundKey, n) {
            const r = responsesCache[roundKey] || {};
            const c = new Array(n).fill(0);
            Object.values(r).forEach(v => { if (v >= 0 && v < n) c[v]++; });
            return c;
        }

        function barsHtml(answers, counts, correctIndex, prevCounts) {
            const total = sum(counts);
            const prevTotal = prevCounts ? sum(prevCounts) : 0;
            return answers.map((ans, i) => {
                const c = counts[i] || 0;
                const p = total ? Math.round(c / total * 100) : 0;
                const ok = (correctIndex !== null && correctIndex !== undefined && i === correctIndex);
                let extra = '';
                if (prevCounts) { const pp = prevTotal ? Math.round((prevCounts[i] || 0) / prevTotal * 100) : 0; extra = ` · was ${pp}%`; }
                return `<div class="bar-row">
                    <div class="bar-top"><span class="bar-label">${L(i)}. ${esc(ans)}${ok ? ' ✓' : ''}</span><span class="bar-pct${ok ? ' c' : ''}">${c} (${p}%)${extra}</span></div>
                    <div class="bar-track"><div class="bar-fill${ok ? ' correct' : ''}" style="width:${p}%"></div></div>
                </div>`;
            }).join('');
        }

        function correctnessFlow(r1key, r2key, correct) {
            const r1 = responsesCache[r1key] || {}, r2 = responsesCache[r2key] || {};
            let cc = 0, cw = 0, wc = 0, ww = 0;
            Object.keys(r2).forEach(s => {
                if (r1[s] === undefined) return;
                const a1 = r1[s] === correct, a2 = r2[s] === correct;
                if (a1 && a2) cc++; else if (a1 && !a2) cw++; else if (!a1 && a2) wc++; else ww++;
            });
            return { cc, cw, wc, ww };
        }

        function flowSvg(f) {
            const total = f.cc + f.cw + f.wc + f.ww;
            if (total === 0) return '<div style="text-align:center;color:#999;font-size:16px;padding:40px 0;">No paired responses yet.</div>';
            const H = 176, top = 16, lx0 = 28, lx1 = 56, rx0 = 204, mid = 130;
            const r1c = f.cc + f.cw, r1w = f.wc + f.ww, r2c = f.cc + f.wc, r2w = f.cw + f.ww;
            const Lc = r1c / total * H, Lw = r1w / total * H, Rc = r2c / total * H, Rw = r2w / total * H;
            const Lcc_t = top, Lcc_b = top + (r1c ? f.cc / r1c * Lc : 0);
            const Lcw_t = Lcc_b, Lcw_b = top + Lc;
            const Lwc_t = top + Lc, Lwc_b = top + Lc + (r1w ? f.wc / r1w * Lw : 0);
            const Lww_t = Lwc_b, Lww_b = top + H;
            const Rcc_t = top, Rcc_b = top + (r2c ? f.cc / r2c * Rc : 0);
            const Rwc_t = Rcc_b, Rwc_b = top + Rc;
            const Rcw_t = top + Rc, Rcw_b = top + Rc + (r2w ? f.cw / r2w * Rw : 0);
            const Rww_t = Rcw_b, Rww_b = top + H;
            const green = 'rgba(46,125,50,0.32)', gray = 'rgba(120,120,120,0.20)';
            const rib = (at, ab, bt, bb, fill) => `<path d="M${lx1},${at} C${mid},${at} ${mid},${bt} ${rx0},${bt} L${rx0},${bb} C${mid},${bb} ${mid},${ab} ${lx1},${ab} Z" fill="${fill}"></path>`;
            const wcPct = Math.round(f.wc / total * 100);
            return `<svg viewBox="0 0 260 215" width="100%">
                ${f.cc ? rib(Lcc_t, Lcc_b, Rcc_t, Rcc_b, green) : ''}
                ${f.cw ? rib(Lcw_t, Lcw_b, Rcw_t, Rcw_b, gray) : ''}
                ${f.wc ? rib(Lwc_t, Lwc_b, Rwc_t, Rwc_b, green) : ''}
                ${f.ww ? rib(Lww_t, Lww_b, Rww_t, Rww_b, gray) : ''}
                <rect x="${lx0}" y="${top}" width="28" height="${Lc}" fill="#cfe9d6" stroke="#2e7d32" stroke-width="0.5"></rect>
                <rect x="${lx0}" y="${top + Lc}" width="28" height="${Lw}" fill="#e4e4e4" stroke="#b5b5b5" stroke-width="0.5"></rect>
                <rect x="${rx0}" y="${top}" width="28" height="${Rc}" fill="#cfe9d6" stroke="#2e7d32" stroke-width="0.5"></rect>
                <rect x="${rx0}" y="${top + Rc}" width="28" height="${Rw}" fill="#e4e4e4" stroke="#b5b5b5" stroke-width="0.5"></rect>
                <text x="42" y="208" text-anchor="middle" font-size="12" fill="#777">Round 1</text>
                <text x="218" y="208" text-anchor="middle" font-size="12" fill="#777">Round ${arguments[1] || 2}</text>
                ${f.wc ? `<text x="130" y="118" text-anchor="middle" font-size="11.5" fill="#1f6e3d" font-weight="500">${wcPct}% moved to correct</text>` : ''}
            </svg>`;
        }

        function renderJoin() {
            const base = location.href.substring(0, location.href.lastIndexOf('/'));
            const studentUrl = base + '/index.html';
            document.getElementById('meta').textContent = '';
            document.getElementById('content').innerHTML = `<div class="join">
                <h2>ECON7110 Live</h2><p>Scan to join</p>
                <div id="qrcode"></div>
                <div class="url">${studentUrl}</div>
            </div>`;
            new QRCode(document.getElementById('qrcode'), { text: studentUrl, width: 280, height: 280, colorDark: '#51247A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
        }

        function renderLive(q) {
            const n = q.answers.length, round = q.round || 1, open = !!q.open, rounds = q.rounds || 1, showBars = !!q.showRound1Bars;
            const counts = countsForRound('round' + round, n), total = sum(counts);
            const discussing = (!open && round < rounds);
            const opts = '<div class="opt-list">' + q.answers.map((ans, i) => `<div class="opt"><span class="l">${L(i)}.</span><span>${esc(ans)}</span></div>`).join('') + '</div>';
            const main = (discussing && showBars) ? barsHtml(q.answers, countsForRound('round1', n), null, null) : opts;
            document.getElementById('meta').textContent = q.type === 'poll' ? 'Poll' : '';
            const qtextHtml = `<div class="qtext">${esc(q.text)}</div>`;
            let html;
            if (discussing) {
                const icon = '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 8h7M7.5 11.5h4"/><path d="M4 5.5h11a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 2.6V16H4a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 4 5.5Z"/><path d="M18.5 9.5H20a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-1v2l-2.5-2"/></svg>';
                html = `<div class="discuss-bar">${icon}<div><div class="dh">Talk it through</div><div class="ds">Compare with those around you — you'll vote again in a moment.</div></div></div>${qtextHtml}${main}`;
            } else {
                const status = open ? ((round > 1 ? `Round ${round} — ` : '') + `voting open · ${total} response${total === 1 ? '' : 's'}`) : 'Voting closed';
                html = `${qtextHtml}<div class="status">${status}</div>${main}`;
            }
            document.getElementById('content').innerHTML = html;
        }

        function renderReveal(q) {
            const n = q.answers.length, rounds = q.rounds || 1;
            const correct = (q.revealedCorrect !== undefined && q.revealedCorrect !== null) ? q.revealedCorrect : null;
            const isPoll = (q.type === 'poll' || correct === null);
            document.getElementById('meta').textContent = isPoll ? 'Poll · results' : 'Results';
            let body;
            if (isPoll) {
                const counts = countsForRound('round1', n), total = sum(counts);
                body = `<div class="qtext">${esc(q.text)}</div>${barsHtml(q.answers, counts, null, null)}<div class="total">${total} response${total === 1 ? '' : 's'}</div>`;
            } else if (rounds <= 1) {
                const counts = countsForRound('round1', n), total = sum(counts);
                body = `<div class="qtext">${esc(q.text)}</div>${barsHtml(q.answers, counts, correct, null)}<div class="total">${total} response${total === 1 ? '' : 's'}</div>`;
            } else {
                const c1 = countsForRound('round1', n), c2 = countsForRound('round' + rounds, n);
                const t1 = sum(c1), t2 = sum(c2);
                const p1 = t1 ? Math.round((c1[correct] || 0) / t1 * 100) : 0;
                const p2 = t2 ? Math.round((c2[correct] || 0) / t2 * 100) : 0;
                const flow = correctnessFlow('round1', 'round' + rounds, correct);
                const gain = `After discussing, <strong>${p2}% chose the correct answer</strong> — ${p2 >= p1 ? 'up from' : 'compared with'} ${p1}% on the first vote.`;
                body = `<div class="qtext">${esc(q.text)}</div>
                    <div class="gain">${gain}</div>
                    <div class="reveal-grid">
                        <div>${barsHtml(q.answers, c2, correct, c1)}</div>
                        <div>${flowSvg(flow, rounds)}<div class="flow-title">How the room moved, round 1 → round ${rounds}</div></div>
                    </div>
                    <div class="total">${t2} response${t2 === 1 ? '' : 's'}</div>`;
            }
            document.getElementById('content').innerHTML = body;
        }

        // ---------- Number game (guess a fraction of the class average) ----------
        function numCfg(q) {
            const min = Number.isInteger(q.numMin) ? q.numMin : 1;
            const max = Number.isInteger(q.numMax) ? q.numMax : 100;
            const factor = (typeof q.factor === 'number' && q.factor > 0) ? q.factor : 2 / 3;
            return { min, max, factor, label: factorLabel(factor) };
        }
        function factorLabel(f) {
            const known = [[2 / 3, '⅔'], [1 / 2, '½'], [3 / 4, '¾'], [1 / 3, '⅓']];
            for (const [v, s] of known) if (Math.abs(f - v) < 1e-6) return s;
            return String(Math.round(f * 100) / 100);
        }
        function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
        function toArr(x) { return Array.isArray(x) ? x : Object.values(x || {}); }
        function numRoundLabel(round, rounds) {
            if (rounds <= 1) return '';
            return round >= rounds ? 'Final round' : `Round ${round} of ${rounds}`;
        }
        const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + 's')}`;

        // While a round is open: the rules and a live count. Between rounds: average and target only.
        function renderNumberLive(q) {
            const cfg = numCfg(q);
            const rounds = q.roundsNow || q.rounds || 1, round = q.round || 1;
            const stats = q.stats || {};
            document.getElementById('meta').textContent = numRoundLabel(round, rounds);
            const qtextHtml = `<div class="qtext">${esc(q.text || '')}</div>`;
            const earlier = (upTo) => {
                let h = '';
                for (let r = 1; r <= upTo; r++) {
                    const s = stats['round' + r];
                    if (s && s.n) h += `<div class="num-prev">Round ${r}: average <strong>${f1(s.mean)}</strong> → target <strong class="t">${f1(s.target)}</strong></div>`;
                }
                return h ? `<div class="num-prevs">${h}</div>` : '';
            };
            let html;
            if (q.open) {
                const total = Object.keys(responsesCache['round' + round] || {}).length;
                const steps = [
                    `Enter a whole number from ${cfg.min} to ${cfg.max} on your phone.`,
                    `We average everyone's numbers and multiply by ${cfg.label}. That is the target.`,
                    `${rounds > 1 ? 'After the final round, the' : 'The'} guess closest to the target wins. Ties go to a random draw.`
                ];
                html = `${qtextHtml}<div class="status">Guessing open · ${plural(total, 'guess', 'guesses')} in</div>${earlier(round - 1)}
                    <div class="opt-list">${steps.map((s, i) => `<div class="opt"><span class="l">${i + 1}.</span><span>${s}</span></div>`).join('')}</div>`;
            } else {
                const st = stats['round' + round];
                const closedLabel = rounds > 1 ? `Round ${round} closed` : 'Guessing closed';
                if (!st) html = `${qtextHtml}<div class="status">${closedLabel} · counting…</div>`;
                else if (!st.n) html = `${qtextHtml}<div class="status">${closedLabel} · no guesses</div>${earlier(round - 1)}`;
                else html = `${qtextHtml}<div class="status">${closedLabel} · ${plural(st.n, 'guess', 'guesses')}</div>
                    <div class="num-tiles">
                        <div class="num-tile"><div class="k">Class average</div><div class="v">${f1(st.mean)}</div></div>
                        <div class="num-tile t"><div class="k">Target = ${cfg.label} × average</div><div class="v">${f1(st.target)}</div></div>
                    </div>${earlier(round - 1)}`;
            }
            document.getElementById('content').innerHTML = html;
        }

        // Final reveal: one distribution per round on a shared axis, plus the winner.
        function renderNumberReveal(q) {
            const cfg = numCfg(q);
            const stats = q.stats || {};
            const F = q.finalRound || q.round || 1;
            const fs = stats['round' + F] || {};
            const w = q.winner || null;
            document.getElementById('meta').textContent = 'Results';

            const N = cfg.max - cfg.min + 1;
            const left = (v) => ((v - cfg.min + 0.5) / N * 100).toFixed(3) + '%';
            const rows = [];
            let maxC = 1;
            for (let r = 1; r <= F; r++) {
                const s = stats['round' + r];
                if (!s || !s.n) continue;
                rows.push({ r, s });
                for (let k = cfg.min; k <= cfg.max; k++) maxC = Math.max(maxC, (s.hist || [])[k] || 0);
            }
            const rowH = rows.length <= 1 ? 260 : (rows.length === 2 ? 150 : (rows.length === 3 ? 104 : 78));
            const rowsHtml = rows.map(({ r, s }) => {
                let bars = '';
                for (let k = cfg.min; k <= cfg.max; k++) {
                    const c = (s.hist || [])[k] || 0;
                    bars += `<div style="height:${(c / maxC * (rowH - 4)).toFixed(1)}px"></div>`;
                }
                return `<div class="num-row">
                    <div class="num-rl"><div class="r">Round ${r}</div><div class="a">average ${f1(s.mean)}</div><div class="t">target ${f1(s.target)}</div></div>
                    <div class="num-plot" style="height:${rowH}px">
                        <div class="num-bars" style="--n:${N}">${bars}</div>
                        <div class="num-m avg" style="left:${left(s.mean)}"></div>
                        <div class="num-m tgt" style="left:${left(s.target)}"></div>
                    </div>
                </div>`;
            }).join('');

            const span = cfg.max - cfg.min;
            const step = span >= 50 ? 10 : (span >= 20 ? 5 : 1);
            const ticks = [cfg.min];
            for (let v = Math.ceil((cfg.min + 1) / step) * step; v < cfg.max; v += step) ticks.push(v);
            ticks.push(cfg.max);
            const axis = `<div class="num-axis"><div class="sp">Number guessed</div><div class="tk">${ticks.map(v => `<span style="left:${left(v)}">${v}</span>`).join('')}</div></div>`;

            let gain = '';
            if (rows.length > 1) {
                const a = rows[0], b = rows[rows.length - 1];
                if (f1(a.s.target) === f1(b.s.target)) gain = `The target stayed at <strong>${f1(b.s.target)}</strong>.`;
                else gain = `The target ${b.s.target < a.s.target ? 'fell' : 'rose'} from <strong>${f1(a.s.target)}</strong> in round ${a.r} to <strong>${f1(b.s.target)}</strong> in round ${b.r}.`;
            } else if (rows.length === 1) {
                gain = `Class average <strong>${f1(rows[0].s.mean)}</strong> × ${cfg.label} = target <strong>${f1(rows[0].s.target)}</strong>.`;
            }

            let win;
            if (!fs.n) {
                win = `<div class="num-win"><div class="k">Final round</div><p style="margin-top:10px;">No guesses were recorded.</p></div>`;
            } else if (w) {
                win = `<div class="num-win"><div class="k">Winning guess</div><div class="g">${esc(w.guess)}</div>
                    <p>${f1(Math.abs(w.guess - w.target))} from the final target of ${f1(w.target)}</p>
                    ${w.tied > 1 ? `<p>${esc(w.tied)} people were equally close. The winner was drawn at random.</p>` : ''}
                    <div class="code"><div class="ck">Winner code</div><div class="cv">${esc(w.code || '')}</div></div>
                    <p>Check your phone. The winner's screen shows this code.</p></div>`;
            } else {
                const closest = toArr(fs.closest);
                win = `<div class="num-win"><div class="k">Closest guess${closest.length > 1 ? 'es' : ''}</div><div class="g">${esc(closest.join(' / '))}</div>
                    <p>${f1(Math.abs(closest[0] - fs.target))} from the final target of ${f1(fs.target)}</p>
                    <p>${fs.closestCount > 1 ? esc(fs.closestCount) + ' people are equally close. The winner will be drawn at random.' : 'The winner is about to be announced.'}</p></div>`;
            }

            document.getElementById('content').innerHTML = `<div class="qtext">${esc(q.text || '')}</div>
                ${gain ? `<div class="gain">${gain}</div>` : ''}
                <div class="num-grid">
                    <div>
                        ${rows.length ? `<div class="num-legend"><span><i class="avg"></i>Class average</span><span><i class="tgt"></i>Target (${cfg.label} × average)</span></div>${rowsHtml}${axis}` : ''}
                    </div>
                    ${win}
                </div>`;
        }

        function render() {
            const a = (!resultsVisible) ? null : activeQ();
            manageRespSub(a ? a.id : null);
            const mode = a ? (a.q.revealed === true ? 'reveal:' + a.id : 'live:' + a.id) : 'join';
            if (mode === 'join') {
                if (lastMode === 'join') return;
                lastMode = 'join';
                renderJoin();
                return;
            }
            lastMode = mode;
            if (a.q.type === 'number') {
                if (a.q.revealed === true) renderNumberReveal(a.q); else renderNumberLive(a.q);
                return;
            }
            if (a.q.revealed === true) renderReveal(a.q);
            else renderLive(a.q);
        }

        render();
    </script>
</body>
</html>
